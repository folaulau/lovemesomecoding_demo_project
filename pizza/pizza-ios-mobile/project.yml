# XcodeGen manifest.
#
# The generated `Pizza.xcodeproj` is COMMITTED — a reader clones, opens it and hits Run, with no
# extra tooling to install. This file is kept alongside it as the readable source of truth: a build
# setting changed here shows up as one legible line in a diff, whereas the same change made in
# Xcode's project editor is an opaque line in project.pbxproj that no reviewer can evaluate.
#
# After changing this file, regenerate and commit both:
#
#     brew install xcodegen      # once
#     xcodegen generate
name: Pizza
options:
  bundleIdPrefix: com.lovemesomecoding.pizza
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # Pinned so the committed .xcodeproj opens in Xcode 15.4 as well as newer releases.
  #
  # XcodeGen defaults to object version 77, the format Xcode 16 writes, and Xcode 15 refuses it
  # outright with "a future Xcode project file format". 56 is the last format Xcode 15 reads, and
  # newer Xcodes open it happily — so the lower number is the compatible one, not the worse one.
  objectVersion: 56
  xcodeVersion: "15.4"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

# Stripe's PaymentSheet, resolved by Swift Package Manager.
#
# `StripePaymentSheet` is the only product linked: the umbrella `Stripe` product pulls in Apple Pay,
# Identity, financial connections and more, none of which this app uses, and all of which end up in
# the binary and in App Review's questions.
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    minVersion: "23.27.0"
    maxVersion: "24.0.0"

targets:
  Pizza:
    type: application
    platform: iOS
    sources:
      - path: Pizza
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
    settings:
      base:
        INFOPLIST_FILE: Pizza/Resources/Info.plist
        # The name on the home screen. Per-target, never in the shared .xcconfig — see the comment
        # in Config/Shared.xcconfig for what happens when it is not.
        PRODUCT_NAME: StayHub Pizza
        # The SWIFT module name, which would otherwise be derived from PRODUCT_NAME as
        # "StayHub_Pizza". The tests say `@testable import Pizza`, and a reader would reasonably
        # expect the module to be named after the app rather than after its marketing title.
        PRODUCT_MODULE_NAME: Pizza
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  PizzaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PizzaTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Pizza
    settings:
      base:
        # A host application, so the tests run inside the app's own process and can reach
        # @MainActor types and the bundle. A pure logic bundle would be faster to launch but could
        # not construct a view model.
        PRODUCT_NAME: PizzaTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StayHub Pizza.app/StayHub Pizza
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pizza:
    build:
      targets:
        Pizza: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Pizza
      targets:
        - PizzaTests
    archive:
      config: Release
