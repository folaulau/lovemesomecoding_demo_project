# nginx serving the built Angular app, and proxying the API alongside it.
#
# Deliberately the SAME shape as pizza-react-frontend/nginx.conf: the browser
# only ever talks to this server, /api/... is forwarded to the API container over
# the compose network, and everything else is a static file. One origin, so no
# cross-origin request and CORS never enters the picture.
#
# What differs between the two apps is not this file — it is how each one was
# TOLD to use a relative API URL:
#
#   React    a Docker build arg, VITE_API_BASE_URL="", read by Vite at build time
#   Angular  a whole extra file, src/environments/environment.container.ts, plus a
#            `container` configuration in angular.json to swap it in
#
# Angular has no runtime environment mechanism and no `import.meta.env`, so
# `fileReplacements` is the mechanism. Neither value can be changed with
# `docker run -e`: both are compiled into the bundle.
#
# The unprivileged nginx image listens on 8080, not 80 — see the Dockerfile.

server {
    listen       8080;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------- the API
    # ⚠️ `api` is the COMPOSE SERVICE NAME, resolved by Docker's embedded DNS on
    # the project network, and 8085 is the port INSIDE that container. Neither
    # value has anything to do with what is published on the host — this request
    # never leaves the Docker network.
    location /api/ {
        proxy_pass         http://api:8085;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product images are served by the API from its uploads volume.
    location /uploads/ {
        proxy_pass       http://api:8085;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------ static files
    # Angular's production build hashes every filename (`outputHashing: "all"`),
    # so the bytes at a given URL never change and a year is safe.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ THE line every single-page app needs. The Angular Router owns /menu and
    # /checkout, but those are not files — a visitor who reloads on /checkout, or
    # arrives from a bookmark, asks nginx for a file that does not exist and gets
    # a 404 from a working app. try_files falls back to index.html so the router
    # sees the URL and renders the right screen.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles, so a cached copy points at files the
    # new build no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
