# Activated with -Dspring-boot.run.profiles=local,messaging (see MessagingConfig).
#
# ⚠️ These credentials are not optional. Boot's default is `mode=native` to
# localhost:61616 with NO user and NO password, and the Artemis container rejects an
# anonymous connection — the listener then retries forever behind a single line,
# "AMQ229031: Unable to validate user: null", which says nothing about credentials
# being absent rather than wrong.
#
# They must match ARTEMIS_USER / ARTEMIS_PASSWORD in docker-compose.yml. Throwaway
# local values; a real broker's credentials would come from the environment.
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=admin
