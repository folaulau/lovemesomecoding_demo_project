spring.application.name=pizza-springboot-backend
spring.profiles.active=local

# 8085, deliberately. On this machine 8080 is taken by another Java app and 8099 by
# the lovemesomecoding admin API. Note that a Boot app binds *:port on IPv6 while some
# other servers bind 127.0.0.1 on IPv4, so a clashing `curl localhost:PORT` can quietly
# hit the OTHER app and return a plausible-looking 404.
server.port=8085

# ---------------------------------------------------------------- datasource
# Local MySQL, root with an empty password (see pizza/CLAUDE.md).
# connectionTimeZone=LOCAL + preserveInstants=false stop the MySQL driver converting DATETIME
# values between zones. With LocalDateTime (which has no zone) any conversion is silent corruption:
# serverTimezone=UTC made a row stored as 2026-01-01 00:00 read back as 2025-12-31 17:00.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pizza?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&preserveInstants=false
spring.datasource.username=root
spring.datasource.password=

# ---------------------------------------------------------------- jpa
# Liquibase owns the schema. `validate` makes Hibernate refuse to start if the
# entities and the tables have drifted apart, which is exactly what we want:
# a loud failure at boot beats a silent mismatch discovered in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# NOTE: hibernate.jdbc.time_zone=UTC is deliberately NOT set.
# All timestamp columns map to java.time.LocalDateTime, which carries no zone. Setting that
# property makes Hibernate read a DATETIME as if it were UTC and convert it to the JVM zone, so a
# row stored as 2026-01-01 00:00 came back as 2025-12-31 17:00 — every timestamp silently shifted.
# Use Instant/OffsetDateTime if you genuinely need zone-aware storage; with LocalDateTime the
# mapping must stay a straight, unconverted read.

# ---------------------------------------------------------------- liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------------------------------------------------------------- search
# OFF by default. Without this, Spring Data would scan and register ProductSearchRepository,
# which then requires an ElasticsearchOperations bean and a reachable node at startup - so a
# plain `./mvnw spring-boot:run` would fail on any machine without Elasticsearch running.
# application-search.properties turns it back on.
spring.data.elasticsearch.repositories.enabled=false
spring.elasticsearch.uris=http://localhost:9200

# ---------------------------------------------------------------- mail
# NO spring.mail.host by default, and that is the switch: without it Boot builds no
# JavaMailSender at all and MailService quietly does nothing. To actually send, run a
# local sink and point at it - MailHog or Mailpit both work:
#   docker run -p 1025:1025 -p 8025:8025 axllent/mailpit
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--spring.mail.host=localhost,--spring.mail.port=1025
# then read what was "sent" at http://localhost:8025. Never point a demo at a real
# SMTP relay - the first bad test address is a bounce on somebody's real domain.
pizza.mail.from=orders@pizza.test

# ---------------------------------------------------------------- thymeleaf
# Template caching OFF for development so an edit to receipt.html shows on refresh.
# Boot's own default is true, and leaving it that way locally means every template
# change looks like it did nothing until the app is restarted.
spring.thymeleaf.cache=false

# ---------------------------------------------------------------- openapi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------------------------------------------------------- app
# HS256 needs >= 256 bits of key. Overridden in application-local.properties.
pizza.jwt.secret=change-me-this-is-a-development-only-placeholder-secret-key
pizza.jwt.expiration-minutes=120

# Stripe keys are NEVER committed. Put real test keys in
# application-local.properties (gitignored) or set the env vars below.
pizza.stripe.secret-key=${STRIPE_SECRET_KEY:}
pizza.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
pizza.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Pricing. Server-side only — the client never sends a price.
pizza.pricing.tax-rate=0.085
pizza.pricing.delivery-fee=3.99

# Where the frontends run, for CORS.
pizza.cors.allowed-origins=http://localhost:5173,http://localhost:4200

# ---------------------------------------------------------------- uploads
# Local disk. Gitignored - see .gitignore. Production would point at S3 instead.
pizza.storage.upload-dir=./uploads/products
pizza.storage.max-image-bytes=2097152

# The servlet-level backstop. It must be LARGER than pizza.storage.max-image-bytes,
# because a request killed here never reaches the controller and cannot produce a
# friendly error. max-request-size covers the whole multipart body, not one part -
# raising only max-file-size still rejects a large upload, which is a confusing hour
# to spend the first time it happens.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
