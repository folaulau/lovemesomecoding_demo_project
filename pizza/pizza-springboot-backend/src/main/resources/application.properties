spring.application.name=pizza-springboot-backend

# 8085, deliberately. On this machine 8080 is taken by another Java app and 8099 by
# the lovemesomecoding admin API. Note that a Boot app binds *:port on IPv6 while some
# other servers bind 127.0.0.1 on IPv4, so a clashing `curl localhost:PORT` can quietly
# hit the OTHER app and return a plausible-looking 404.
server.port=8085

# ---------------------------------------------------------------- datasource
# Local MySQL, root with an empty password (see pizza/CLAUDE.md).
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pizza?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ---------------------------------------------------------------- jpa
# Liquibase owns the schema. `validate` makes Hibernate refuse to start if the
# entities and the tables have drifted apart, which is exactly what we want:
# a loud failure at boot beats a silent mismatch discovered in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------- liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------------------------------------------------------------- openapi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------------------------------------------------------- app
# HS256 needs >= 256 bits of key. Overridden in application-local.properties.
pizza.jwt.secret=change-me-this-is-a-development-only-placeholder-secret-key
pizza.jwt.expiration-minutes=120

# Stripe keys are NEVER committed. Put real test keys in
# application-local.properties (gitignored) or set the env vars below.
pizza.stripe.secret-key=${STRIPE_SECRET_KEY:}
pizza.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
pizza.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Where the frontends run, for CORS.
pizza.cors.allowed-origins=http://localhost:5173,http://localhost:4200
