# Activated with -Dspring-boot.run.profiles=local,search
#
# A profile-specific file is the cleanest way to flip a default: these values override
# the ones in application.properties, and nothing in the default configuration has to
# know that this profile exists.
spring.data.elasticsearch.repositories.enabled=true

# 9202, not Elasticsearch's default 9200: another project on this machine already
# publishes a node there, and pointing at it would not fail — it would index the menu
# into somebody else's cluster. docker-compose.yml publishes ours on 9202 to match.
spring.elasticsearch.uris=http://localhost:9202
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=10s
