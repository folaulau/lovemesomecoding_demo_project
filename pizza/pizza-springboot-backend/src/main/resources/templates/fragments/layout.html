<!DOCTYPE html>
<!--
  Shared page furniture.

  A fragment is a named, reusable chunk of a template. `th:fragment="name(args)"` declares one;
  `th:replace="~{fragments/layout :: name(...)}"` pulls it in elsewhere. This is Thymeleaf's answer
  to the copy-and-paste header that drifts out of step between pages.
-->
<html xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The parameter is used here. `th:text` REPLACES the element's body, so the placeholder
         text below is only ever seen when opening this file directly in a browser - which is the
         whole point of Thymeleaf's "natural templates": a designer can open it without a server. -->
    <title th:text="${title}">Pizza</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0; padding: 2rem 1rem; background: #f6f6f7; color: #16161a;
      }
      .sheet {
        max-width: 40rem; margin: 0 auto; background: #fff; border-radius: 12px;
        padding: 2rem; box-shadow: 0 1px 3px rgba(0,0,0,.12);
      }
      h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
      .muted { color: #6b6b75; font-size: .875rem; }
      table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
      th, td { text-align: left; padding: .5rem 0; border-bottom: 1px solid #ececf0; }
      td.num, th.num { text-align: right; }
      tfoot td { border-bottom: none; padding: .25rem 0; }
      tfoot tr:last-child td { font-weight: 700; font-size: 1.125rem; border-top: 2px solid #16161a; padding-top: .75rem; }
      .toppings { color: #6b6b75; font-size: .8125rem; }
      .footer { margin-top: 2rem; text-align: center; }
      @media print { body { background: #fff; padding: 0; } .sheet { box-shadow: none; } .no-print { display: none; } }
    </style>
  </head>

  <body>
    <!-- th:remove="tag" drops this <div> but keeps its children, so the fragment does not
         inject a stray wrapper element into every page that uses it. -->
    <div th:fragment="brand" th:remove="tag">
      <h1>🍕 Pizza</h1>
      <p class="muted">Thank you for your order</p>
    </div>

    <div th:fragment="footer" class="footer muted">
      <p>Questions? Reply to your confirmation email.</p>
      <p th:text="'Receipt generated ' + ${#temporals.format(#temporals.createNow(), 'd MMM yyyy, HH:mm')}">
        Receipt generated
      </p>
    </div>
  </body>
</html>
