# nginx serving the built React app, and proxying the API alongside it.
#
# This is the "one origin" shape. The browser only ever talks to this server:
# /api/... is forwarded to the API container over the compose network, everything
# else is a static file. Because the SPA and the API share an origin, there is no
# cross-origin request at all and CORS never enters the picture.
#
# The unprivileged nginx image listens on 8080, not 80 — see the Dockerfile.

server {
    listen       8080;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------- the API
    # ⚠️ `api` is the COMPOSE SERVICE NAME, resolved by Docker's embedded DNS on
    # the project network. It is not a hostname that exists anywhere else, and
    # `localhost:8085` here would mean *this container*, which serves no API.
    #
    # 8085 is the port INSIDE the api container. The host-side publish is
    # irrelevant here; this request never leaves the Docker network.
    location /api/ {
        proxy_pass         http://api:8085;
        proxy_http_version 1.1;

        # Without these the API sees every request as coming from the nginx
        # container on the container network, so logs, rate limits and any
        # absolute URL it generates are all wrong.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product images are served by the API from its uploads volume.
    location /uploads/ {
        proxy_pass       http://api:8085;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------ static files
    # Hashed filenames, so the content at a given URL can never change. Cache
    # them for a year and let a new build produce new names.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ THE line every single-page app needs. React Router owns /menu and
    # /checkout, but those are not files — a visitor who reloads on /checkout, or
    # arrives from a bookmark, asks nginx for a file that does not exist and gets
    # a 404 from a working app. try_files falls back to index.html so the router
    # sees the URL and renders the right screen.
    #
    # It is the last location on purpose: /api/ and /assets/ are matched first.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must NOT be cached, or a returning visitor keeps loading
    # the old one — which references asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
