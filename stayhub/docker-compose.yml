# Backing services for StayHub.
#
# Every port here is shifted off its default because this machine already runs the defaults:
#   Postgres      5433  (5432 is a native install)
#   Hasura        8081
#   Elasticsearch 9200
#   Redis         6380  (6379 is a native install AND another project's container)
#
# The app itself (FastAPI, the two React apps) is NOT in here — it is run from a terminal so it
# reloads on save. Compose owns only the things that would be a pain to install natively.
#
#   docker compose up -d          # postgres + hasura + elasticsearch + redis
#   docker compose down           # stop
#   docker compose down -v        # stop AND wipe the data
#
# ---------------------------------------------------------------------------------------------
# CREDENTIALS — all of them, in one place
# ---------------------------------------------------------------------------------------------
#
# | Service         | URL                              | Username | Password / secret       |
# |-----------------|----------------------------------|----------|-------------------------|
# | Postgres        | localhost:5433  db `stayhub`     | stayhub  | stayhub                 |
# | Hasura console  | http://localhost:8081            | —        | stayhub-admin-secret    |
# | Elasticsearch   | http://localhost:9200            | —        | none (security off)     |
# | Redis           | localhost:6380                   | —        | none (no requirepass)   |
#
# Connection strings, ready to paste:
#
#   psql            psql "postgresql://stayhub:stayhub@localhost:5433/stayhub"
#   SQLAlchemy      postgresql+psycopg://stayhub:stayhub@localhost:5433/stayhub
#   Hasura API      curl -H "x-hasura-admin-secret: stayhub-admin-secret" http://localhost:8081/v1/graphql
#   Elasticsearch   curl http://localhost:9200/_cluster/health
#   Redis           redis-cli -p 6380 ping        (or: docker exec -it stayhub-redis redis-cli)
#
# Note: `docker exec stayhub-postgres psql -U stayhub -d stayhub` needs NO password, and that is
# not a misconfiguration — the image trusts connections originating inside the container. Over the
# published port on 5433, which is how the app and every tool on your machine connect, the password
# IS enforced: a wrong one is refused.
#
# The APP's own logins are seeded by `stayhub-fastapi-backend/scripts/seed.py`, NOT by anything
# here — these three are infrastructure accounts:
#
#   guest@stayhub.test / guest123    a guest
#   host@stayhub.test  / host123     a guest who also hosts
#   admin@stayhub.test / admin123    staff (the /admin console on :5175)
#
# ⚠️ Every credential above is a throwaway local fixture, checked in ON PURPOSE so the demo runs
# with one command. That is the ONLY reason it is acceptable to have them in a committed file.
# Nothing here may be reused anywhere reachable — see the per-service notes below for what each
# one would need instead. The one secret that is NOT here is the Stripe secret key: it lives in
# `stayhub-fastapi-backend/.env`, which is gitignored, because that one is real.

name: stayhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: stayhub-postgres
    restart: unless-stopped
    environment:
      # Username, password and database are all `stayhub` — deliberately boring, so the
      # connection string is memorable and nobody is tempted to write it down elsewhere.
      #
      #   host   localhost      port 5433   (5432 INSIDE the compose network — see hasura below)
      #   user   stayhub
      #   pass   stayhub
      #   db     stayhub
      #
      # In production these come from a secret store and the password is not the username.
      POSTGRES_USER: stayhub
      POSTGRES_PASSWORD: stayhub
      POSTGRES_DB: stayhub
    ports:
      - "5433:5432"
    volumes:
      - stayhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` ships in the image. Health-check with a command the container actually has —
      # a curl-based check on an image without curl reports unhealthy forever while the service
      # serves happily, and `up --wait` then blames the wrong thing.
      test: ["CMD-SHELL", "pg_isready -U stayhub -d stayhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.42.0
    container_name: stayhub-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      # Postgres credentials again, as a URL — user `stayhub`, password `stayhub`, db `stayhub`.
      #
      # ⚠️ Inside the compose network Postgres is on its OWN port, 5432. The 5433 shift is a
      # host-side publish only. Using 5433 here is a classic and confusing failure.
      HASURA_GRAPHQL_DATABASE_URL: postgres://stayhub:stayhub@postgres:5432/stayhub
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      # ⚠️ The admin secret. There is no username — this single value IS the credential, and it
      # is what the console at http://localhost:8081 asks for. It grants the built-in `admin`
      # role, which bypasses EVERY permission rule in hasura/metadata.py.
      #
      # It belongs in scripts (hasura/scripts/apply.py sends it) and in the console. It must
      # NEVER reach a browser bundle — that would hand every visitor unrestricted access. Both
      # frontends send a JWT instead; grep for it in src/ and you will find nothing.
      HASURA_GRAPHQL_ADMIN_SECRET: stayhub-admin-secret
      # Hasura verifies the SAME token FastAPI signs. One login, two services.
      # ⚠️ This key must match STAYHUB_JWT_SECRET in stayhub-fastapi-backend/.env exactly. If the
      # two drift, every authenticated GraphQL query fails while the REST API keeps working —
      # a confusing way to find out.
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"dev-only-change-me-in-any-real-deployment-0123456789"}'
      # A request with no Authorization header is treated as this role, so anonymous visitors can
      # browse published listings. Its permissions are still declared in metadata — this only
      # names the role, it grants nothing on its own.
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      # Expose columns to GraphQL as `pricePerNight`, not `price_per_night`. Without this the
      # frontends read snake_case from Hasura and camelCase from FastAPI, and every component that
      # touches both has to remember which is which.
      HASURA_GRAPHQL_EXPERIMENTAL_FEATURES: naming_convention
      HASURA_GRAPHQL_DEFAULT_NAMING_CONVENTION: graphql-default
    volumes:
      - ./hasura/metadata:/hasura-metadata
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: stayhub-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # ⚠️ NO CREDENTIALS AT ALL — that is what `xpack.security.enabled: false` means. It removes
      # TLS and the built-in `elastic` superuser password so the demo needs no certificate dance,
      # and it leaves http://localhost:9200 open to anything that can reach the port.
      #
      # Acceptable only because this is bound to localhost on a development machine. With security
      # ON you would get a generated `elastic` password (or `bin/elasticsearch-reset-password`)
      # plus a CA cert the client has to trust — which is the right setup anywhere reachable, and
      # several steps of ceremony that teach nothing about search.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - stayhub-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------------------------
  # Redis — the read cache and the rate limiter's counters.
  #
  # ⚠️ NOTHING HERE IS REQUIRED. The API starts, serves and passes its whole test suite with this
  # container stopped. `core/cache.py` treats an unreachable Redis as a permanent cache miss and
  # `core/rate_limit.py` fails OPEN. That is deliberate and it is the interesting part of the
  # design: a cache that can take the site down has stopped being an optimisation.
  #
  # Prove it: `docker compose stop redis`, reload a listing page, watch it still work.
  redis:
    image: redis:7-alpine
    container_name: stayhub-redis
    restart: unless-stopped
    # ⚠️ 6380:6379 — the LEFT number is the shifted host port, the right one is Redis's default
    # inside the container. 6379 on this machine is taken twice over (a Homebrew redis-server and
    # another project's container), and the failure when it clashes is not a clean "port in use":
    # if the other Redis wins the bind, StayHub connects to IT, shares its keyspace, and the only
    # symptom is cache entries that appear and vanish for no reason.
    ports:
      - "6380:6379"
    command:
      # Cap the memory and evict rather than fail. Without `maxmemory` a cache grows until the
      # container is OOM-killed; without a policy Redis starts REFUSING WRITES when it hits the
      # cap, which turns a full cache into failing requests — the exact coupling this service is
      # designed not to have. `allkeys-lru` is right here because every key in this instance is
      # disposable: cached listings and rate-limit counters both regenerate on demand.
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      # No persistence. This holds nothing that cannot be rebuilt from Postgres in one query, so
      # writing an RDB would buy nothing and cost a fork of the process at snapshot time.
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------------------------
  # The API, containerised. OPT-IN via a profile.
  #
  #     docker compose up -d                    # backing services only — the default, unchanged
  #     docker compose --profile api up -d      # backing services PLUS the API in a container
  #
  # ⚠️ It is behind a profile because the documented workflow runs uvicorn on the HOST with
  # --reload, which is far better for development. Both bind port 8000, so running this while the
  # host uvicorn is up fails with "port is already allocated". That is the intended, obvious
  # failure — the alternative was a second port that nothing else in the project knows about.
  api:
    build:
      context: ./stayhub-fastapi-backend
    image: stayhub-api:local
    container_name: stayhub-api
    profiles: ["api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      # `service_started`, NOT `service_healthy`. Redis is optional to this app, so waiting on its
      # health would make an optional dependency block startup — reintroducing exactly the coupling
      # core/cache.py exists to avoid.
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      # ⚠️ `postgres:5432` and `elasticsearch:9200` — the SERVICE NAME and the container's own
      # port. The 5433 in the host workflow is a host-side publish only and means nothing inside
      # this network. Same trap the hasura service documents above; it catches everyone once.
      STAYHUB_DATABASE_URL: postgresql+psycopg://stayhub:stayhub@postgres:5432/stayhub
      STAYHUB_ELASTICSEARCH_URL: http://elasticsearch:9200
      # `redis:6379` — the SERVICE NAME and the container's own port. The 6380 above is a
      # host-side publish and means nothing on this network, same trap as postgres:5432.
      STAYHUB_REDIS_URL: redis://redis:6379/0
      # Must match the hasura service's HASURA_GRAPHQL_JWT_SECRET key, above.
      STAYHUB_JWT_SECRET: dev-only-change-me-in-any-real-deployment-0123456789
      STAYHUB_LOG_JSON: "true"
      # `localhost` here is the BROWSER's localhost — the Vite dev servers on the host machine —
      # not the container's. CORS is judged by what the browser sends in `Origin`.
      STAYHUB_CORS_ORIGINS: '["http://localhost:5174","http://localhost:5175"]'
    volumes:
      # Uploads must outlive the container. Without this, every restart silently loses every photo
      # a host ever added — the container filesystem is not storage.
      - stayhub-uploads:/app/uploads


volumes:
  stayhub-pgdata:
  stayhub-esdata:
  stayhub-uploads:
