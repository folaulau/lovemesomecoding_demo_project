spring.application.name=reelcms-springboot-backend

# 8087. pizza-springboot-backend holds 8085 and the lovemesomecoding admin API holds
# 8099. Note that a Boot app binds *:port on IPv6 while some other servers bind
# 127.0.0.1 on IPv4, so a clashing `curl localhost:PORT` can quietly reach the OTHER
# app and return a plausible-looking 404.
server.port=8087

# ---------------------------------------------------------------- mongodb
#
# NOTE THE PREFIX: spring.mongodb.*, NOT spring.data.mongodb.*.
#
# Spring Boot 4 moved the CONNECTION properties out of spring.data.mongodb into
# spring.mongodb (the split matches the new spring-boot-mongodb module). The old
# names are marked deprecated at level=error, but a properties file is not
# validated - so `spring.data.mongodb.uri` is read by nobody, no warning is
# printed, and the driver quietly falls back to its default of
# mongodb://localhost:27017. The symptom is a connection refused against a port
# that appears nowhere in your configuration.
#
# spring.data.mongodb.auto-index-creation below KEEPS the old prefix, because it
# is a Spring Data setting rather than a connection one. The two prefixes coexist
# on purpose.
#
# ?replicaSet=rs0 is REQUIRED, not decorative. Without it the driver connects in
# single-server mode, which works for ordinary reads and writes and then fails only
# when the change stream starts - so the app looks healthy and the live dashboard is
# silently dead.
#
# The port is 27018 on both sides of the container boundary. See docker-compose.yml:
# a replica set advertises its member addresses and the driver reconnects to whatever
# it is told, so "localhost:27018" has to be true from here as well as from inside.
spring.mongodb.uri=mongodb://localhost:27018/reelcms?replicaSet=rs0

# spring.mongodb.database is deliberately NOT set. The URI already names the
# database, and when BOTH are present the standalone property WINS - it overrides
# the database component of the URI without any warning.
#
# That cost real data here: the integration test overrides only the uri, pointing
# it at reelcms_test, and with a `database` property still in this file every test
# ran against the live `reelcms` database instead and its @BeforeEach cleanup
# deleted the demo content. One source of truth for the database name.

# OFF, deliberately. Every index is declared in MongoIndexConfig and created at
# startup. Leaving this on means an @Indexed annotation can trigger an index build
# against a live collection the moment someone adds it - a production incident that
# starts as a one-line diff.
spring.data.mongodb.auto-index-creation=false

# ---------------------------------------------------------------- uploads
# 100 MB, matching the MAX_BYTES check in the Vue MediaUpload component. Raising one
# without the other means either a file the UI rejects that the server would accept,
# or - worse - an upload that runs to completion and then 413s.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

reelcms.media.dir=./uploads

# ---------------------------------------------------------------- security
# HS256 needs at least 256 bits of key. A shorter secret fails at STARTUP with a
# WeakKeyException that does not mention this file.
# Override in production: REELCMS_JWT_SECRET=...
reelcms.jwt.secret=${REELCMS_JWT_SECRET:reelcms-local-development-secret-key-change-me-in-production}
reelcms.jwt.ttl-hours=12

# Explicit origins, not "*" - allowCredentials with a wildcard is rejected by the
# browser. 5176 is the Vue dev server, 4176 is `npm run preview`.
reelcms.cors.allowed-origins=http://localhost:5176,http://localhost:4176

# ---------------------------------------------------------------- docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------------------------------------------------------- logging
logging.level.com.reelcms=INFO
# Uncomment to see every query and aggregation pipeline the app issues. The single
# most useful line in this file when a pipeline is not returning what you expect.
#logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
